# What the Codex adapter emits (contracts/adapter-fields/v1). scripts/build.mjs reads it; see adapters/claude/fields.yaml
# for how a field is chosen. A Codex agent is TOML: name, description and developer_instructions (the body) are required.
# Codex cannot restrict tools, so launches-agents: false stays a sentence in the body.
# Dates: when agent-knowledge ai-agents/subagent-execution-boundaries.md and codex-usage-reference.md last checked the source.
schema: adapter-fields/v1
adapter: codex
version: 1
targets:
  agents: { folder: ~/.codex/agents, file: '{name}.toml', link: per-entry, format: toml }
  skills: { folder: ~/.agents/skills, file: '{name}/SKILL.md', link: per-entry, format: markdown }
fields: []
events: { session-start: SessionStart, pre-tool: PreToolUse, prompt-submit: UserPromptSubmit, stop: Stop }
