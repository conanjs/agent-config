# Layer 1 of the doc guards: the same validators the pre-commit hook runs, as a required check.
# Required on main by branch protection (set 2026-10-27: required status check "validate-docs", admins not enforced).
name: validate-docs
on:
  push:
    paths: ['copilot/knowledge/**', 'copilot/procedures/**', 'copilot/frameworks/knowledge/**', 'copilot/frameworks/agentic-sdlc/**', 'copilot/frameworks/agent-foundry/**', 'scripts/check-docs.sh', 'tests/**', 'package.json', 'pnpm-lock.yaml', 'cucumber.mjs', '.github/workflows/validate-docs.yml']
  # No paths filter on pull_request: this check is required on main, and GitHub leaves a required check from a
  # path-filtered (skipped) workflow "Pending", which blocks the merge. The job takes seconds.
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # weekly: procedure freshness and upstream versions (layer 4)
  workflow_dispatch:
jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # current LTS (Krypton); the validators need >= 18, Cucumber.js 13 needs 22 or 24+
          package-manager-cache: false
      - run: corepack enable && pnpm install --frozen-lockfile # pnpm version from package.json packageManager
      - name: Validate knowledge, procedures and frameworks; run the tool scenarios
        run: scripts/check-docs.sh
      - name: Check upstream versions of procedure dependencies (warnings only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node copilot/procedures/tools/validate-procedures.mjs --upstream
          node copilot/frameworks/agentic-sdlc/tools/validate.mjs --upstream
