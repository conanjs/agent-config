schema: rendered-copy/v1
system: mac
copy: generated/agentic-sdlc/foo.md
first-line: 'Generated from `<source path>`; edit that file, not this copy.'
mode: read-write
index: '{{AGENT_HOME}}/generated/index.md'
refresh:
  on: [install]
  session-start:
    { only-changed: true, time-limit-seconds: 5, network: none, on-failure: keep-previous-print-one-line-exit-0 }
citations:
  - text: /Users/v/.agent-config/knowledge/x.md
    target: ../../knowledge/x.md
