# What the Claude Code adapter emits (contracts/adapter-fields/v1). scripts/build.mjs reads it.
# A field is written only when its neutral source key matches `from`; `key` is the platform's spelling when it is
# not lowercase-hyphen; `values` maps a neutral value, `value` is a constant, otherwise the neutral value is copied.
# Dates: when agent-knowledge ai-agents/subagent-execution-boundaries.md and agent-skills-portability.md last checked the source.
schema: adapter-fields/v1
adapter: claude
version: 1
targets:
  agents: { folder: ~/.claude/agents, file: '{name}.md', link: per-entry, format: markdown }
  skills: { folder: ~/.claude/skills, file: '{name}/SKILL.md', link: per-entry, format: markdown, keep: [synced] }
fields:
  - name: model
    applies-to: agent
    from: { model-tier: [top, standard] }
    values: { top: opus, standard: sonnet }
    source: https://code.claude.com/docs/en/sub-agents
    verified: 2026-11-11
  - name: disallowed-tools
    key: disallowedTools
    applies-to: agent
    from: { launches-agents: false }
    value: Agent
    enforced: true
    source: https://code.claude.com/docs/en/sub-agents
    verified: 2026-11-11
  - name: skills
    applies-to: agent
    from: { preload: [] }
    source: https://code.claude.com/docs/en/sub-agents
    verified: 2026-11-11
  - name: disable-model-invocation
    applies-to: skill
    from: { auto-delegate: false }
    value: true
    source: https://code.claude.com/docs/en/skills
    verified: 2026-11-11
# Claude Code enforces launches-agents: false itself, so bodies drop the sentence inside {{unless claude}}.
events: { session-start: SessionStart, pre-tool: PreToolUse, prompt-submit: UserPromptSubmit, stop: Stop }
