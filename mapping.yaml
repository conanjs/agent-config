# Source -> destination routing table for installers/install.sh and installers/install.ps1.
# Format is intentionally flat/fixed (one flow-mapping per line) so it can be
# parsed with plain grep/sed (bash) or a regex (PowerShell) — no yq/python
# YAML dependency required. Do not reformat entries across multiple lines;
# installers/lib/link-or-copy.{sh,ps1} expect exactly this single-line
# "- { source: ..., target: ..., strategy: ... }" shape.
#
# strategy: symlink   -> ln -s the repo file/dir at the target path (existing
#                         real file/dir at target is backed up first, once).
# strategy: seed-once  -> copy the repo file to target ONLY if target doesn't
#                         already exist. Never touched again after that —
#                         for files that accumulate machine-local state
#                         (e.g. ~/.claude/settings.json permissions, or
#                         global-variables.md's machine-specific values).
#
# source is relative to this repo; ../ reaches a sibling folder.

# Core content (home/ in this repo).
- { source: home/instructions,               target: ~/.copilot/instructions,               strategy: symlink }
- { source: home/references,                 target: ~/.copilot/references,                 strategy: symlink }
- { source: home/companies,                  target: ~/.copilot/companies,                  strategy: symlink }
- { source: home/procedures,                 target: ~/.copilot/procedures,                 strategy: symlink }
- { source: home/patterns,                   target: ~/.copilot/patterns,                   strategy: symlink }
- { source: home/atlas,                      target: ~/.copilot/atlas,                      strategy: symlink }
- { source: home/tracker,                    target: ~/.copilot/tracker,                    strategy: symlink }
- { source: home/prompts,                    target: ~/.copilot/prompts,                    strategy: symlink }
- { source: home/hooks,                      target: ~/.copilot/hooks,                      strategy: symlink }
- { source: home/global-variables.md,        target: ~/.copilot/global-variables.md,        strategy: seed-once }
# ~/.copilot/frameworks is a real folder with one link per framework, because they come from different folders.
- { source: home/frameworks/agent-foundry,   target: ~/.copilot/frameworks/agent-foundry,   strategy: symlink }
- { source: home/frameworks/company-kb,      target: ~/.copilot/frameworks/company-kb,      strategy: symlink }
# Other components, cloned or copied next to this repo (see SETUP.md). A missing source is skipped with a warning.
- { source: ../agent-knowledge/knowledge,            target: ~/.copilot/knowledge,              strategy: symlink }
- { source: ../agent-knowledge/frameworks/knowledge, target: ~/.copilot/frameworks/knowledge,   strategy: symlink }
- { source: ../agentic-sdlc,                         target: ~/.copilot/frameworks/agentic-sdlc, strategy: symlink }
# Per-agent files that are not built (adapters/<agent>/).
- { source: adapters/claude/CLAUDE.md,       target: ~/.claude/CLAUDE.md,                   strategy: symlink }
- { source: adapters/claude/plugins/blocklist.json, target: ~/.claude/plugins/blocklist.json, strategy: symlink }
- { source: adapters/claude/settings.json,   target: ~/.claude/settings.json,               strategy: seed-once }
- { source: home/instructions/core.instructions.md, target: ~/.codex/AGENTS.md,             strategy: symlink }
- { source: adapters/codex/hooks.json,       target: ~/.codex/hooks.json,                   strategy: symlink }
# Skills and agents are not listed here: the installer runs `node scripts/build.mjs --link`, which builds them per agent
# into dist/ and links each one into ~/.claude/skills, ~/.agents/skills, ~/.claude/agents, ~/.codex/agents and
# ~/.copilot/agents (adapters/<agent>/fields.yaml names the folders).
