# What the GitHub Copilot adapter emits (contracts/adapter-fields/v1). scripts/build.mjs reads it; see adapters/claude/fields.yaml
# for how a field is chosen. `user-invocable` is not written: its default is true (VS Code custom agent file reference).
# Dates: when agent-knowledge ai-agents/subagent-execution-boundaries.md and agent-skills-portability.md last checked the source.
schema: adapter-fields/v1
adapter: copilot
version: 1
targets:
  agents: { folder: ~/.copilot/agents, file: '{name}.agent.md', link: per-entry, format: markdown }
  skills: { folder: ~/.agents/skills, file: '{name}/SKILL.md', link: per-entry, format: markdown }
fields:
  - name: disable-model-invocation
    applies-to: agent
    from: { auto-delegate: false }
    value: true
    enforced: true
    source: https://code.visualstudio.com/docs/agents/reference/custom-agent-file-reference
    verified: 2026-11-11
  - name: disable-model-invocation
    applies-to: skill
    from: { auto-delegate: false }
    value: true
    source: https://code.visualstudio.com/docs/agent-customization/agent-skills
    verified: 2026-11-11
events: { session-start: sessionStart }
