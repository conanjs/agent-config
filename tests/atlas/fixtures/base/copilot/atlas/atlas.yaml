  - { id: readme, area: docs, home: "README.md", title: "Readme", summary: "Where to start", schema: —, index: —, checked-by: —, tests: —, deploy: — }
  - { id: doc, area: docs, home: "docs/**", title: "Docs", summary: "Every other document", schema: —, index: docs/index.md, checked-by: —, tests: —, deploy: — }
  - { id: atlas-file, area: meta, home: "copilot/atlas/**", title: "Atlas files", summary: "Registry and generated pages", schema: —, index: copilot/atlas/index.md, checked-by: "atlas.mjs", tests: —, deploy: — }
edges:
  - { from: doc, to: guide, via: "the docs index lists each guide", checked-by: — }
  - { from: readme, to: doc, via: "the README points at the docs index", checked-by: — }
