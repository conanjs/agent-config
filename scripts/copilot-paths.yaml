# Record of the sorting check of the hard-coded Copilot home paths (specs/022 T149, AC-8.4, FR-032). The check
# scripts/check-copilot-paths.ts reads it: own: is the allow-list of paths Copilot itself owns (kept), and
# agent-home-lines: is the count per file of agent-home lines (to become the placeholder in phase 5). A file with more such
# lines than recorded fails the check; lowering a count is a human edit made when a line is converted.
# The plan's numbers (484 lines in 131 files, 445 placeholder lines) are the count of main on 2026-11-11 (486 lines in 134 files
# and 445 placeholder lines on main at 91e213a, measured 2026-11-16 with git grep); this worktree has more because the spec
# folder, the scenarios and their fixtures (specs/022, tests/) were added since. Those added lines are recorded as they are.
schema: copilot-paths/v1
method: >-
  scripts/check-copilot-paths.ts (tool version 1) classified every line of every file that git ls-files lists in this worktree
  (branch feat/022-phase-2) that names the Copilot home folder, a tilde then /.copilot, other than a longer name such as
  that folder followed by a hyphen; node v24.22.1, git 2.50.1. Cross-check by plain count, git grep -F -c over the same files:
  679 lines in 186 files, of which 677 are not a longer name. 677 lines in 186 files: agent-home 513 in 152 files, copilot-own 164.
