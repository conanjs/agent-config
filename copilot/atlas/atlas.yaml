# The atlas registry (atlas/v1, schemas/atlas.schema.md): every repo, area and kind of file, and the chains
# between kinds. The pages in index.md and map/ are generated from it: edit this file, then run
#   node copilot/atlas/tools/atlas.mjs --write
# A file belongs to the FIRST kind below whose `home` glob matches, so specific kinds come before general ones.
# Owner: the coordinator role (copilot/frameworks/agentic-sdlc/agents/coordinator.md).

repos:
  - { id: agent-config, root: ., ref: —, url: —, title: "agent-config", summary: "Agent instructions, frameworks, knowledge, procedures, wrappers, skills and their installers" }
  - { id: reference-typescript-node, root: "{{REFERENCE_REPOS_ROOT}}/typescript-node", ref: v4.2.0, url: "https://github.com/conanjs/agentic-sdlc-reference-typescript-node/blob/v4.2.0", title: "typescript-node reference (feature-first)", summary: "The stack reference on main: two modules through every layer, pinned in stacks/typescript-node/reference.md" }
  - { id: reference-typescript-node-layer-first, root: "{{REFERENCE_REPOS_ROOT}}/typescript-node", ref: v1.5.1, url: "https://github.com/conanjs/agentic-sdlc-reference-typescript-node/blob/v1.5.1", title: "typescript-node reference (layer-first)", summary: "The maintained layer-first variant on branch layout/layer-first" }

areas:
  # agent-config
  - { id: start, repo: agent-config, parent: root, title: "Start here", summary: "What the repo is, how to set it up, how to contribute, and what gets installed where" }
  - { id: instructions, repo: agent-config, parent: root, title: "Instructions", summary: "Always-on instructions every agent loads" }
  - { id: atlas, repo: agent-config, parent: root, title: "Atlas", summary: "This map: the registry, its schema, its tool and the generated pages" }
  - { id: frameworks, repo: agent-config, parent: root, title: "Frameworks", summary: "Rule sets with schemas and validators: agentic-sdlc, knowledge, company-kb, agent-foundry" }
  - { id: agentic-sdlc, repo: agent-config, parent: frameworks, title: "Agentic SDLC framework", summary: "Roles, foundations, decision trees, stacks and paradigms for spec-driven, multi-agent delivery" }
  - { id: knowledge-framework, repo: agent-config, parent: frameworks, title: "Knowledge framework", summary: "Schemas and validator for the global knowledge base" }
  - { id: company-kb-framework, repo: agent-config, parent: frameworks, title: "Company KB framework", summary: "Schemas for per-company knowledge bases" }
  - { id: agent-foundry, repo: agent-config, parent: frameworks, title: "Agent Foundry", summary: "Charters, floors, trees and lenses for standalone review and triage agents" }
  - { id: knowledge, repo: agent-config, parent: root, title: "Global knowledge", summary: "Cross-project reference docs: how technologies and techniques work, with sources" }
  - { id: companies, repo: agent-config, parent: root, title: "Company knowledge bases", summary: "Facts about one company's systems, one folder per company" }
  - { id: procedures, repo: agent-config, parent: root, title: "Procedures", summary: "Repeatable multi-step tasks, written once in tool-neutral prose" }
  - { id: patterns, repo: agent-config, parent: root, title: "Patterns", summary: "Named, reusable techniques learned from real cases" }
  - { id: agents, repo: agent-config, parent: root, title: "Agents, prompts and tool settings", summary: "Per-tool wrappers (Copilot, Claude Code, Codex) that point at the shared definitions" }
  - { id: skills, repo: agent-config, parent: root, title: "Skills", summary: "Tool-neutral SKILL.md files installed for Claude Code, Copilot and Codex" }
  - { id: installers, repo: agent-config, parent: root, title: "Installers", summary: "Link or seed this repo's files into the home folder, per mapping.yaml" }
  - { id: specs, repo: agent-config, parent: root, title: "Specs and decisions", summary: "Spec Kit setup, one spec folder per change, and the design notes written before Spec Kit" }
  - { id: tests, repo: agent-config, parent: root, title: "Tool tests", summary: "Cucumber scenarios for every validator, installer and tool" }
  - { id: tooling, repo: agent-config, parent: root, title: "Repo tooling", summary: "Checks, hooks, CI and the test dependencies" }
  - { id: templates, repo: agent-config, parent: root, title: "Templates", summary: "Files copied into other repos on demand" }
  # typescript-node reference, feature-first
  - { id: ref-src, repo: reference-typescript-node, parent: root, title: "Source", summary: "The composition root, module composers and the four layers of each module" }
  - { id: ref-tests, repo: reference-typescript-node, parent: root, title: "Tests", summary: "Unit tests beside the code, integration tests and their helpers" }
  - { id: ref-records, repo: reference-typescript-node, parent: root, title: "Records", summary: "Architecture, glossary, constitution, specs and decision records" }
  - { id: ref-tooling, repo: reference-typescript-node, parent: root, title: "Tooling", summary: "Lint, formatting, TypeScript, tests, scripts and CI configuration" }
  # typescript-node reference, layer-first
  - { id: lf-src, repo: reference-typescript-node-layer-first, parent: root, title: "Source", summary: "The composition root and the four layers at the top of src/" }
  - { id: lf-tests, repo: reference-typescript-node-layer-first, parent: root, title: "Tests", summary: "Unit tests beside the code, integration tests and their helpers" }
  - { id: lf-records, repo: reference-typescript-node-layer-first, parent: root, title: "Records", summary: "Architecture, glossary, constitution, specs and decision records" }
  - { id: lf-tooling, repo: reference-typescript-node-layer-first, parent: root, title: "Tooling", summary: "Lint, formatting, TypeScript, tests, scripts and CI configuration" }

